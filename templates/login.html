{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card card">

    <h1>
        Welcome back
    </h1>


    <form id="login-form">

        <label>
            Email

            <input
                name="email"
                type="email"
                required
            >

        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
            >

        </label>


        <button
            class="button"
            type="submit"
        >
            Login
        </button>


        <p
            id="form-message"
            class="message"
        ></p>

    </form>


    <p>

        No account?

        <a href="/register">
            Create one
        </a>

    </p>

</div>

{% endblock %}
